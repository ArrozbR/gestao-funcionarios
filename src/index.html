<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Funcionários</title>
</head>
<body>
    <h1>Gestão de Funcionários</h1>

    <h2 id="tituloFormulario">Cadastrar Funcionário</h2>
    <form id="formFuncionario">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </p>
        <p>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="14" max="120">
        </p>
        <p>
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo">
        </p>
        <p>
            <label for="salario">Salário (R$):</label>
            <input type="number" id="salario" min="0" step="0.01">
        </p>
        <p>
            <button type="button" id="btnSalvar">Cadastrar</button>
            <button type="button" id="btnCancelar" hidden>Cancelar edição</button>
        </p>
    </form>

    <h2>Funcionários</h2>
    <p>
        <label for="busca">Buscar por nome:</label>
        <input type="text" id="busca">
    </p>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaFuncionarios"></tbody>
    </table>
    <p id="mensagemVazia">Nenhum funcionário cadastrado.</p>

    <h2>Relatórios</h2>
    <p>
        <button type="button" id="btnSalarioAlto">Salário acima de R$ 5.000</button>
        <button type="button" id="btnMediaSalarial">Média salarial</button>
        <button type="button" id="btnCargosUnicos">Cargos únicos</button>
        <button type="button" id="btnNomesMaiusculo">Nomes em maiúsculo</button>
    </p>
    <h3 id="tituloRelatorio"></h3>
    <ul id="resultadoRelatorio"></ul>

    <script src="js/funcionario.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
